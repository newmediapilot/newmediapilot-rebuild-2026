backend:
  name: git-gateway
  branch: main

local_backend: true
local_backend_url: http://localhost:8081/api/v1

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: tiles
    label: Tiles
    folder: src/content/tiles
    create: true
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Image, name: image, widget: image }
      - { label: Source, name: source, widget: text, required: false, hint: Original link this image was converted from (metadata only). }
      - { label: Body, name: body, widget: markdown, required: false }