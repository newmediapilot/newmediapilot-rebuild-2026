# Decap CMS config
# Production auth on Netlify: enable Identity + Git Gateway in the Netlify UI.
# Locally, `decap-server` (started by `npm run start`) proxies commits to your git repo.

backend:
  name: git-gateway
  branch: main

local_backend: true
local_backend_url: http://localhost:8081/api/v1

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: pages
    label: Pages
    files:
      - name: home
        label: Home
        file: src/pages/index.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Body, name: body, widget: markdown }